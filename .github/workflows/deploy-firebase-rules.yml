name: Deploy Firebase Security Rules & Indexes (Phase 1)

on:
  workflow_dispatch:

jobs:
  deploy-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Monorepo
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Write Temporary Service Account Credentials from GitHub Secret
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Missing FIREBASE_SERVICE_ACCOUNT secret in GitHub Actions!"
            exit 1
          fi
          echo "$FIREBASE_SERVICE_ACCOUNT" > /tmp/gcp-service-account.json

      - name: Deploy Firestore Rules, Storage Rules & Indexes from firebase/
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp-service-account.json
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        working-directory: firebase
        run: |
          if [ -z "$FIREBASE_PROJECT_ID" ]; then
            echo "::error::Missing FIREBASE_PROJECT_ID secret!"
            exit 1
          fi
          firebase deploy --config firebase.json --only firestore:rules,firestore:indexes,storage --project "$FIREBASE_PROJECT_ID" --non-interactive

      - name: Shred Temporary Credentials
        if: always()
        run: rm -f /tmp/gcp-service-account.json
