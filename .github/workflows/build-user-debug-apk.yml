name: Build Native Android Debug APK (Phase 1)

on:
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Monorepo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Verify Static Repo debug.keystore & Print SHA-1 / SHA-256 Fingerprints
        run: |
          [ -f debug.keystore ] || ( [ -f debug.keystore.base64 ] && base64 -d debug.keystore.base64 > debug.keystore )
          if [ ! -f debug.keystore ]; then
            echo "::error::Static debug.keystore is missing from repository root!"
            exit 1
          fi
          echo "=================================================================="
          echo "STATIC DEBUG KEYSTORE FINGERPRINTS (Add once in Firebase Console):"
          echo "=================================================================="
          keytool -list -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android | grep -E "SHA1:|SHA-1:|SHA256:|SHA-256:"
          echo "=================================================================="

      - name: Decode google-services.json from GitHub Secret
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::error::Missing GOOGLE_SERVICES_JSON_BASE64 secret in GitHub Actions!"
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json

      - name: Assemble Native Android Debug APK (:app:assembleDebug)
        uses: gradle/actions/setup-gradle@v4
        with:
          arguments: :app:assembleDebug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: adda-user-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
