name: Build Native Android Debug APK (Phase 1)

# সতর্কতা: এই ওয়ার্কফ্লো এবং debug.keystore.base64 শুধুমাত্র debug বিল্ডের জন্য।
# এটি release বিল্ডে কখনো ব্যবহার হবে না। Release keystore সবসময় GitHub Secrets-এ থাকবে।

on:
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Monorepo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Verify Static Repo debug.keystore
        run: |
          EXPECTED_SHA1="B1:AB:99:5A:3D:A6:30:5F:5F:F7:94:49:A4:1B:9C:CB:D3:1E:5D:06"

          if [ ! -f debug.keystore.base64 ]; then
            echo "::error::debug.keystore.base64 রিপোতে নেই"
            exit 1
          fi

          base64 -d debug.keystore.base64 > debug.keystore

          echo "=================================================================="
          echo "STATIC DEBUG KEYSTORE FINGERPRINTS (ONLY FOR DEBUG BUILDS):"
          echo "=================================================================="
          KEYTOOL_OUT=$(keytool -list -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android)
          echo "$KEYTOOL_OUT" | grep -E "SHA1:|SHA-1:|SHA256:|SHA-256:"
          echo "=================================================================="

          ACTUAL_SHA1=$(echo "$KEYTOOL_OUT" | grep -E "SHA1:|SHA-1:" | head -n 1 | awk '{print $2}')
          if [ "$ACTUAL_SHA1" != "$EXPECTED_SHA1" ]; then
            echo "::error::debug.keystore SHA-1 মেলেনি! প্রত্যাশিত: $EXPECTED_SHA1, পাওয়া গেছে: $ACTUAL_SHA1"
            exit 1
          fi
          echo "SHA-1 সফলভাবে যাচাই হয়েছে: $ACTUAL_SHA1"

      - name: Decode google-services.json from GitHub Secret
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::error::Missing GOOGLE_SERVICES_JSON_BASE64 secret in GitHub Actions!"
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Assemble Native Android Debug APK (:app:assembleDebug)
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: adda-user-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
